# Every 6h: parse recent House PTR PDFs -> congress_house.json, committed to this repo.
# The Basket Mint Function reads it via env HOUSE_JSON_URL =
#   https://raw.githubusercontent.com/<you>/<repo>/main/congress_house.json
name: ingest
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - name: Parse recent House PTRs
        run: |
          node ingest_house_ptr.mjs > congress_house.json.tmp
          node -e "const j=JSON.parse(require('fs').readFileSync('congress_house.json.tmp','utf8'));if(!j||!Array.isArray(j.rows)||!j.rows.length)process.exit(1)"
          mv congress_house.json.tmp congress_house.json
      - name: Commit if changed
        run: |
          git config user.name "congress-ingest-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet -- congress_house.json; then
            git add congress_house.json
            git commit -m "chore: refresh House PTR trades $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no change"
          fi
